<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CVision Lab</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script></head><body><header><b>◉ CVision Lab</b><span>浏览器计算机视觉实验室</span></header><main><section class="hero"><h1>让浏览器<span>看见</span>世界</h1><p>无需后端和 API Token，在本机完成 AI 目标检测。</p><div id="status">正在加载 AI 模型…</div></section><section class="grid"><div class="card"><nav><button class="tab active" data-m="camera">📷 实时摄像头</button><button class="tab" data-m="image">🖼️ 图片识别</button></nav><div id="camera" class="pad"><div class="view"><video id="video" playsinline muted></video><canvas id="canvas"></canvas><div id="empty">◎<h3>实时目标检测</h3></div></div><button id="start" disabled>启动摄像头</button></div><div id="image" class="pad hide"><label id="upload"><input id="file" type="file" accept="image/*">＋<b>上传图片进行识别</b></label><div id="iview" class="view hide"><img id="preview"><canvas id="icanvas"></canvas></div></div></div><aside class="card side"><h3>检测结果 <span id="count">0 个目标</span></h3><label>最低置信度 <b id="tv">50%</b><input id="threshold" type="range" min="20" max="90" value="50"></label><div id="results">等待识别结果</div><p class="privacy">🔒 图片与摄像头画面在浏览器本地处理。</p></aside></section></main><footer>TensorFlow.js + COCO-SSD · ricardoryw/ryw01</footer><script src="app.js"></script></body></html>
